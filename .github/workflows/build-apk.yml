name: Build CoolerBT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download project ZIP
        run: |
          curl -L \
            "https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/CoolerBT_GitHubReady.zip" \
            -o project.zip

      - name: Extract project
        run: |
          unzip -o project.zip -d project
          cp -r project/CoolerBT/. . 2>/dev/null || cp -r project/. .
          find . -maxdepth 2 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.0.2'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerBT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
